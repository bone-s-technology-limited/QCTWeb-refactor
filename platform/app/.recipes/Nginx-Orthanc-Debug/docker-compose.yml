# Reference:
# - https://docs.docker.com/compose/compose-file
# - https://eclipsesource.com/blogs/2018/01/11/authenticating-reverse-proxy-with-keycloak/

services:
  builder:
    build:
      context: ./../../../../
      dockerfile: ./platform/app/.recipes/Nginx-Orthanc-Debug/dockerfile.builder
    image: builder:latest
    container_name: builder
    volumes:
      - ./../../../..:/usr/src/app
    # command: ["sh"]
    # command: ["yarn", "run", "build"]

  # Exposed server that's handling incoming web requests
  ohif_viewer:
    build:
      # Project root
      context: ./../../../../
      # Relative to context
      dockerfile: ./platform/app/.recipes/Nginx-Orthanc-Debug/dockerfile.nginx
    image: webapp:latest
    container_name: nginx
    volumes:
      # Reading build result from builder
      - ./../../dist:/var/www/html
      # Nginx config
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      # Logs
      - ./logs/nginx:/var/log/nginx
      # SSL certificates
      - ./ssl/:/etc/nginx/ssl/
      # HU Save folder
      - ./db:/app/output
    ports:
      - '443:443' # SSL
      - '80:80' # Web
    depends_on:
      - orthanc
      - builder
    restart: on-failure

  # LINK: https://hub.docker.com/r/jodogne/orthanc-plugins/
  # TODO: Update to use Postgres
  # https://github.com/mrts/docker-postgresql-multiple-databases
  orthanc:
    image: jodogne/orthanc-plugins
    hostname: orthanc
    container_name: orthanc
    volumes:
      # Config
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      # Persist data
      - ./volumes/orthanc-db/:/var/lib/orthanc/db/
      # SSL certificates
      - ./ssl/:/etc/orthanc/ssl/
      # HU data
      - ./db/:/etc/orthanc/HU/
    restart: unless-stopped
    ports:
      - '4242:4242' # Orthanc REST API
      - '8042:8042' # Orthanc HTTP
